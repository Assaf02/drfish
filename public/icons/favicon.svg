<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0A1628"/>
  <!-- Spine -->
  <line x1="5" y1="16" x2="24" y2="16" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="25.5" cy="16" r="2.5" fill="white"/>
  <circle cx="26.2" cy="14.8" r="0.8" fill="#0A1628"/>
  <!-- Rib 1 top -->
  <line x1="20" y1="16" x2="17" y2="12.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Rib 2 top -->
  <line x1="16" y1="16" x2="13" y2="12.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Rib 3 top -->
  <line x1="12" y1="16" x2="9"  y2="12.5" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Rib 1 bottom -->
  <line x1="20" y1="16" x2="17" y2="19.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Rib 2 bottom -->
  <line x1="16" y1="16" x2="13" y2="19.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Rib 3 bottom -->
  <line x1="12" y1="16" x2="9"  y2="19.5" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Tail top -->
  <line x1="5" y1="16" x2="2" y2="12" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Tail bottom -->
  <line x1="5" y1="16" x2="2" y2="20" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
</svg>
