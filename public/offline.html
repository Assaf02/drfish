<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dr Fish — Hors ligne</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: #0A1628;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #2E6DB4, #1a4a8a);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      font-size: 40px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: white;
    }
    p {
      font-size: 16px;
      color: rgba(255,255,255,0.6);
      line-height: 1.6;
      max-width: 320px;
      margin: 0 auto 32px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 100px;
      padding: 10px 20px;
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 24px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #C05C00;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    button {
      background: #2E6DB4;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      max-width: 280px;
    }
    button:hover { background: #255a96; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    .tip {
      margin-top: 32px;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      max-width: 280px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="logo">🐟</div>
  <h1>Vous êtes hors ligne</h1>
  <p>Vérifiez votre connexion internet pour accéder à Dr Fish CRM. Vos données locales sont sauvegardées.</p>
  <div class="status">
    <span class="dot"></span>
    <span>Aucune connexion détectée</span>
  </div>
  <button onclick="window.location.reload()">Réessayer</button>
  <p class="tip">💡 Les ventes enregistrées hors ligne seront synchronisées automatiquement dès que vous vous reconnectez.</p>

  <script>
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
